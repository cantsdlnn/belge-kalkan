[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "belge-kalkan"
version = "1.0.0"
description = "Türkçe metinlerde kişisel veri tespiti ve yerel maskeleme aracı"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Nusret Can Taşdelen" }]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]

[project.scripts]
belge-kalkan = "belgekalkan.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["belgekalkan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=belgekalkan --cov-report=term-missing --cov-fail-under=85"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

