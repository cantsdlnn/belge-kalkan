[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "belge-kalkan"
version = "2.0.0"
description = "Türkçe metin, görsel ve PDF'lerde yerel kişisel veri maskeleme aracı"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Nusret Can Taşdelen" }]
dependencies = [
  "fastapi>=0.115,<1",
  "numpy>=1.26,<3",
  "onnxruntime>=1.23,<2",
  "opencv-python>=4.10,<5",
  "pillow>=11,<13",
  "pymupdf>=1.26,<2",
  "python-multipart>=0.0.20,<1",
  "rapidocr>=3.9,<4",
  "uvicorn[standard]>=0.32,<1",
]

[project.urls]
Homepage = "https://github.com/cantsdlnn/belge-kalkan"
Repository = "https://github.com/cantsdlnn/belge-kalkan"
Issues = "https://github.com/cantsdlnn/belge-kalkan/issues"

[project.optional-dependencies]
dev = [
  "httpx2>=2.13,<3",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]

[project.scripts]
belge-kalkan = "belgekalkan.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["belgekalkan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=belgekalkan --cov-report=term-missing --cov-fail-under=85"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
