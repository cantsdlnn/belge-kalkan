name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag belge-kalkan:ci .
      - run: >-
          docker run --rm belge-kalkan:ci python -c
          "from PIL import Image; from belgekalkan.documents import get_ocr_engine;
          print(len(get_ocr_engine().recognize(Image.new('RGB', (320, 120), 'white'))))"
